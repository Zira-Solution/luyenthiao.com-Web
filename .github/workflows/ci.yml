name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # No NEXT_PUBLIC_* values here on purpose. Setting placeholders hid the 2026-11-15 deploy
    # failure: CI was green while the production build died on a host with no env vars.
    # The build must survive missing public env vars (src/lib/env.ts falls back), so CI runs it
    # the same way the deploy host does.
    defaults:
      run:
        working-directory: src
    # Type-check, tests and build gate this job; lint is non-blocking (pre-existing errors, docs/03-known-issues.md section 3).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        # Pre-existing import-order errors; see docs/03-known-issues.md section 3.
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
