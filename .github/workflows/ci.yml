name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder values: src/lib/env.ts requires both variables in production builds.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
    defaults:
      run:
        working-directory: src
    # Type-check, tests and build gate this job; lint is non-blocking (pre-existing errors, docs/03-known-issues.md section 3).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        # Pre-existing import-order errors; see docs/03-known-issues.md section 3.
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
